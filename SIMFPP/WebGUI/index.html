<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimFPP - Monitoramento de Gatos</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SimFPP</h1>
        <p>Monitoramento Simplificado de Gatos</p>
    </header>

    <main class="container">

        <section id="perfil-section" class="card">
            <h2>Perfil do Gato</h2>
            
            <div id="perfil-display" style="display: none;">
            </div>
            
            <button id="btn-editar-perfil" style="display: none;">Editar Perfil</button>
            <button id="btn-cadastrar-perfil" style="display: none;">Cadastrar Gato</button>

            <form id="form-perfil">
                <h3>Preencha as informações do seu Gato</h3>
                
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>

                <label for="raca">Raça:</label>
                <input type="text" id="raca">

                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.01" required>

                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento">
                
                <button type="submit">Salvar Perfil</button>
            </form>
        </section>

        <section id="monitoramento-section" class="card">
            <h2>📊 Monitoramento do Animal</h2>
            
            <div id="status-message"></div>

            <form id="form-registro-comida">
                <h3>Registrar Refeição 🥣</h3>
                
                <div class="form-group-grid">
                    <div>
                        <label for="reg-data">Data:</label>
                        <input type="date" id="reg-data" required>
                    </div>
                    <div>
                        <label for="reg-hora">Hora:</label>
                        <input type="time" id="reg-hora" required>
                    </div>
                </div>

                <div class="form-group-full">
                    <label for="descricao-comida">Descrição (O que o gato comeu?):</label>
                    <input type="text" id="descricao-comida" placeholder="Ex: Ração seca, Sachê de Atum...">
                </div>

                <div class="input-group">
                    <label for="quantidade">Quantas gramas (g)?</label>
                    <input type="number" id="quantidade" min="1" step="1" required>
                    <button type="submit">Registrar</button>
                </div>
            </form>

            <div class="chart-container">
                <canvas id="monitoramentoChart"></canvas>
            </div>

            <div id="historico-container">
                <h3>Histórico de Refeições</h3>
                <ul id="historico-lista">
                </ul>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2024 SimFPP. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
